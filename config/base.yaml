# Base configuration for DocForge
# This file contains default settings that apply to all environments

app:
  name: "DocForge"
  version: "1.0.0"
  debug: false
  host: "0.0.0.0"
  port: 8000
  workers: 1

database:
  host: "localhost"
  port: 5432
  name: "docforge"
  user: "docforge_user"
  # Password should be set in environment-specific config or environment variables
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  echo: false

storage:
  base_path: "storage"
  max_file_size: 104857600  # 100MB
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".docx"
    - ".md"
    - ".rtf"
    - ".odt"
  temp_dir: "temp"
  backup_enabled: true
  backup_retention_days: 30

processing:
  max_workers: 4
  timeout: 300
  chunk_size: 1000
  chunk_overlap: 200
  enable_ocr: true
  ocr_language: "eng"

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dimension: 384
  vector_store_type: "faiss"
  similarity_threshold: 0.7
  max_results: 10
  rerank_enabled: true

security:
  # Secret key MUST be overridden in production
  secret_key: "change-me-in-production"
  jwt_algorithm: "HS256"
  jwt_expiration: 3600
  password_min_length: 8
  max_login_attempts: 5
  lockout_duration: 900
  enable_2fa: false

logging:
  level: "INFO"
  format: "detailed"
  file_enabled: true
  console_enabled: true
  max_file_size: 10485760  # 10MB
  backup_count: 5
  log_dir: "logs"

monitoring:
  enabled: true
  metrics_port: 8080
  health_check_interval: 30
  performance_tracking: true
  alert_thresholds:
    cpu_usage: 80.0
    memory_usage: 85.0
    disk_usage: 90.0
    response_time: 5.0

external_services:
  # API keys should be set in environment-specific config or environment variables
  openai_model: "gpt-3.5-turbo"
  timeout: 30
  max_retries: 3
  retry_delay: 1.0

cache:
  enabled: true
  backend: "memory"
  ttl: 3600
  max_size: 1000
  # redis_url: "redis://localhost:6379/0"  # Uncomment for Redis backend