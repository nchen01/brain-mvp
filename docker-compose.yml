services:
  # Main Brain MVP Application
  brain-mvp:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: brain-mvp-app
    ports:
      - "8080:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://brain_user:brain_password@postgres:5432/brain_mvp
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
      - PROCESSING__DEFAULT_CHUNKING_STRATEGY=${PROCESSING__DEFAULT_CHUNKING_STRATEGY:-recursive}
      - PROCESSING__USE_EMBEDDINGS=${PROCESSING__USE_EMBEDDINGS:-false}
      - PROCESSING__EMBEDDING_MODEL=${PROCESSING__EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./processed:/app/processed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brain-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: brain-mvp-postgres
    environment:
      - POSTGRES_DB=brain_mvp
      - POSTGRES_USER=brain_user
      - POSTGRES_PASSWORD=brain_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    ports:
      - "5433:5432"
    networks:
      - brain-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U brain_user -d brain_mvp" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: brain-mvp-redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - brain-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  brain-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
